training_config:
  project_name: final_mnist_huber_inverse_new
  model_name: ThreeLayerFC
  aggregate_type: fedavg
  dataset_name: MNIST
  num_clients: 200
  fraction_malicious: 0.4
  total_epochs: 200
  q_factor: 0.8
  evaluate_each_epoch: 1
  attack_args:
    attack_type: boost_gradient
    attack_epoch: 2
    boost_factor: -1
  defence_args:
    defence_type: huber
    huber_tau: 0.2
    total_samples: 60000
  batch_size: 64
  local_epochs: 3
  malicious_type: group_oriented
  fedavg_params:
    alpha: 0.01
sweep_config:
  method: grid
  metric:
    name: test_accuracy
    goal: maximize
  parameters:
    defence_args.huber_tau:
      values:
      - 0.12
      - 0.2
    q_factor:
      values:
      - 0.9
      - 0.6
    fraction_malicious:
      values:
      - 0.4
      - 0.3
      - 0.2
      - 0.1
    fedavg_params.alpha:
      values:
      - 0.01